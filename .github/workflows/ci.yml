name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90
      - name: CLI smoke test (packaged H200 step model, synthetic workload)
        run: |
          batchsim simulate --workload synthetic --n 500 --rate 10 --cost h200-qwen2.5-7b
          batchsim compare --workload synthetic --n 300 --rate 5 --num-blocks 20000 --slo-ttft 500
      - name: Validation numbers reproduce from the committed H200 logs
        run: |
          python scripts/validate.py --profile qwen7b --model-name h200-qwen2.5-7b --check
          python scripts/validate.py --profile qwen32b --model-name h200-qwen2.5-32b --check
