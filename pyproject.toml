[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "batchsim"
version = "0.2.0"
description = "Discrete-event simulator for LLM serving schedulers, calibrated against and validated on vLLM"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abhay Khot" }]
keywords = ["llm", "inference", "continuous-batching", "vllm", "scheduling", "simulation"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
bench = ["aiohttp>=3.9"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
batchsim = "batchsim.cli:main"

[project.urls]
Repository = "https://github.com/Abhayrkhot/Continuous-Batching-Simulator"

[tool.hatch.build.targets.wheel]
packages = ["src/batchsim"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "NPY"]
ignore = ["RUF001", "RUF002", "RUF003", "B905"]

[tool.ruff.lint.per-file-ignores]
"bench/**" = ["N802"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/batchsim"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
source = ["batchsim"]
omit = ["*/plots.py"]
